name: Update weather image

on:
  schedule:
    # krumme minuten: glatte zeiten (:00/:15/:30/:45) sind bei github am staerksten
    # ausgelastet, geplante laeufe werden dort verzoegert oder verworfen
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-image:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate weather image
        shell: powershell
        run: ./update-weather-image.ps1 -Once -OutputPath "$env:GITHUB_WORKSPACE\image.jpg"

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add image.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update weather image"
            git push
          else
            echo "No changes to commit"
          fi
